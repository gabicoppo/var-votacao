<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, ~{})}">
<head>
  <title>Não encontrado</title>
</head>
<body>
<main class="erro-pagina">
  <div class="card card-destaque">
    <p class="erro-codigo" aria-hidden="true"><span>🟨</span> 404</p>
    <h1 th:text="|${recurso} não encontrada|">Votação não encontrada</h1>
    <p class="subtitulo">O link pode estar incompleto ou ela não existe mais.</p>
    <a class="btn btn-primario btn-grande" th:href="@{/}">Voltar ao início</a>
  </div>
</main>
</body>
</html>
