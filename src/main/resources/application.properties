spring.application.name=var
server.servlet.session.timeout=60m
# Dados e contas de demonstracao (eleitores e01..e12/1234). Desligado nos testes.
var.demo.ativo=true
# Senha do organizador da demonstracao. Em producao, defina VAR_SENHA_ORGANIZADOR (veja docs/deploy.md).
var.senha-organizador=${VAR_SENHA_ORGANIZADOR:var2026}
# Health check do deploy: so o endpoint health, sem detalhes.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
