# Perfil de producao (Render): SPRING_PROFILES_ACTIVE=prod. Veja docs/deploy.md.
# Porta definida pela plataforma.
server.port=${PORT:8080}
# Atras do proxy HTTPS do Render: links absolutos (convite) saem com https.
server.forward-headers-strategy=framework
# Cookie de sessao so por HTTPS e inacessivel ao JavaScript.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
spring.thymeleaf.cache=true
# Erros sem detalhes internos para o usuario.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
# A entrega e uma demonstracao: dados de exemplo ativos.
var.demo.ativo=true
# Sem VAR_SENHA_ORGANIZADOR, a senha do organizador e gerada e escrita no log de inicializacao.
var.senha-organizador=${VAR_SENHA_ORGANIZADOR:}
# O login nao mostra a senha do organizador em producao.
var.demo.mostrar-senha-organizador=false
